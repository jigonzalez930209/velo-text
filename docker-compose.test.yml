version: '3.8'

services:
  pde-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: velo_test
      POSTGRES_USER: velo
      POSTGRES_PASSWORD: velo
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velo -d velo_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  pde-minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9100:9000"
      - "9101:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
