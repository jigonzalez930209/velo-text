name: CI
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check zero runtime deps
        run: pnpm run check:zero-deps
      - name: Type check (strict)
        run: pnpm run check:types
      - name: Lint (core isolation)
        run: pnpm run lint
      - name: Check circular imports
        run: node scripts/check-circular.js
      - name: Build
        run: pnpm run build
      - name: Unit tests
        run: pnpm run test:unit
      - name: Integration tests
        run: pnpm run test:integration
      - name: Fixtures validation (33 files)
        run: node --experimental-strip-types scripts/validate-fixtures.ts
      - name: Export smoke (PDF/ODT/DOCX deterministic)
        run: node --experimental-strip-types scripts/smoke-export.ts
      - name: Build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist
          path: dist/

  visual:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # Placeholder for Percy/Chromatic or custom visual snapshots
      - run: echo "visual tests — toolbar, document, tables, variables, images (see tests/visual)"
