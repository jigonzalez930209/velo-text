name: CI
on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check zero runtime deps
        run: pnpm run check:zero-deps
      - name: Type check (strict)
        run: pnpm run check:types
      - name: Lint (core isolation)
        run: pnpm run lint
      - name: Check circular imports
        run: node scripts/check-circular.js
      - name: Build
        run: pnpm run build
      - name: Unit tests
        run: pnpm run test:unit
      - name: Integration tests
        run: pnpm run test:integration
      - name: Property tests
        run: pnpm run test:property
      - name: Soak export (short)
        run: SOAK_ITERS=8 node scripts/soak.js
      - name: Security corpus
        run: pnpm run test:security
      - name: Coverage (skipped until threshold is restored)
        if: false
        run: pnpm run coverage
      - name: Fixtures validation (33 files)
        run: node --experimental-strip-types scripts/validate-fixtures.ts
      - name: Export smoke (PDF/ODT/DOCX deterministic)
        run: node --experimental-strip-types scripts/smoke-export.ts
      - name: Build VitePress docs (includes playground)
        env:
          DOCS_BASE: /velo-text/
        run: pnpm run docs:build
      - name: Visual HTML snapshots
        run: pnpm run test:visual && git diff --exit-code -- tests/visual/snapshots
      - name: Install poppler (PDF page rasters)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: PDF perceptual goldens
        run: pnpm run test:pdf-pages && git diff --exit-code -- tests/visual/pdf-pages
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist
      - name: Build artifacts
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: dist
          path: dist/

  deploy-docs:
    needs: verify
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
