name: CI
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check zero runtime deps
        run: pnpm run check:zero-deps
      - name: Type check (strict)
        run: pnpm run check:types
      - name: Lint (core isolation)
        run: pnpm run lint
      - name: Check circular imports
        run: node scripts/check-circular.js
      - name: Build
        run: pnpm run build
      - name: Unit tests
        run: pnpm run test:unit
      - name: Integration tests
        run: pnpm run test:integration
      - name: Property tests
        run: pnpm run test:property
      - name: Soak export (short)
        run: SOAK_ITERS=8 node scripts/soak.js
      - name: Security corpus
        run: pnpm run test:security
      - name: Coverage (skipped until threshold is restored)
        if: false
        run: pnpm run coverage
      - name: Fixtures validation (33 files)
        run: node --experimental-strip-types scripts/validate-fixtures.ts
      - name: Export smoke (PDF/ODT/DOCX deterministic)
        run: node --experimental-strip-types scripts/smoke-export.ts
      - name: Build VitePress docs (includes playground)
        run: pnpm run docs:build
      - name: Visual HTML snapshots
        run: pnpm run test:visual && git diff --exit-code -- tests/visual/snapshots
      - name: Build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist
          path: dist/
